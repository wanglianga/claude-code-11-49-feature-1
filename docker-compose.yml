services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mpi
      POSTGRES_USER: mpi
      POSTGRES_PASSWORD: mpi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpi -d mpi"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: mpi
      DB_USER: mpi
      DB_PASS: mpi
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
